<!DOCTYPE html>

<head>

<title>Archive Curator — Prune Review</title>
<style>
  :root{
    --bg:#0b0b0c; --panel:#141416; --border:#2a2a2e; --text:#eee; --dim:#9a9a9e;
    --accent:#4da3ff; --danger:#e5484d; --danger-bg:rgba(229,72,77,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:13px; line-height:1.4;
  }
  #topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
    background:var(--panel); border-bottom:1px solid var(--border); padding:10px 16px; flex-wrap:wrap;
  }
  #topbar h1{font-size:15px; font-weight:600; white-space:nowrap;}
  #search{
    flex:1; min-width:160px; max-width:320px; background:#1c1c1f; border:1px solid var(--border);
    color:var(--text); padding:6px 10px; border-radius:6px; font-size:13px;
  }
  #counter{color:var(--dim); white-space:nowrap;}
  #counter b{color:var(--danger);}
  button{
    background:#1c1c1f; color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:6px 12px; font-size:13px; cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button.danger{color:var(--danger); border-color:var(--danger);}
  #layout{display:flex;}
  #jumpnav{
    width:200px; min-width:200px; height:calc(100vh - 49px); overflow-y:auto; position:sticky; top:49px;
    border-right:1px solid var(--border); padding:10px 0;
  }
  #jumpnav a{
    display:flex; justify-content:space-between; gap:6px; padding:5px 14px; color:var(--dim);
    text-decoration:none; font-size:12px;
  }
  #jumpnav a:hover{background:#1c1c1f; color:var(--text);}
  #jumpnav span.n{color:#555;}
  #main{flex:1; min-width:0; padding:0 16px 60px;}
  .group{padding-top:14px;}
  .group-header{
    position:sticky; top:49px; z-index:10; background:var(--bg); padding:8px 0; margin-bottom:8px;
    display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border);
  }
  .group-header h2{font-size:14px; font-weight:600;}
  .group-header .cnt{color:var(--dim); font-size:12px;}
  .group-header .sel-all{font-size:11px; color:var(--dim); cursor:pointer; margin-left:auto; user-select:none;}
  .group-header .sel-all:hover{color:var(--accent);}
  .grid{
    display:grid; grid-template-columns:repeat(8, 1fr); gap:10px; padding-bottom:6px;
  }
  @media (max-width: 1400px){ .grid{grid-template-columns:repeat(6,1fr);} }
  @media (max-width: 1000px){ .grid{grid-template-columns:repeat(4,1fr);} #jumpnav{display:none;} }
  .card{
    position:relative; background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:6px; cursor:pointer; transition:border-color .1s;
  }
  .card:hover{border-color:var(--accent);}
  .card.marked{border-color:var(--danger); background:var(--danger-bg);}
  .card .thumb-wrap{
    position:relative; width:100%; aspect-ratio:2/3; background:#1c1c1f; border-radius:4px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .card img{width:100%; height:100%; object-fit:cover; display:block;}
  .card .fallback{color:#555; font-size:10px; text-transform:uppercase; text-align:center; padding:4px;}
  .card .chk{
    position:absolute; top:4px; left:4px; width:18px; height:18px; z-index:2; cursor:pointer;
    accent-color:var(--danger);
  }
  .card .title{
    font-size:11px; margin-top:6px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; color:var(--text);
  }
  .card .mtype{font-size:9px; color:var(--dim); text-transform:uppercase; margin-top:2px;}
  #empty-msg{color:var(--dim); padding:40px; text-align:center; display:none;}
</style>
</head>

  <button id="clearBtn" class="danger">Clear marks</button>
</div>

</div>

":"LeonardCohen-YouWantItDarker2016","t":"Leonard Cohen - You Want It Darker (2016)","a":"Leonard Cohen","c":"music_and_sound","m":"audio","cr":"","u":"https://archive.org/details/LeonardCohen-YouWantItDarker2016"},{"id":"JeTaime...MoiNonPlus","t":"Je t'aime... moi non plus","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"Jane Birkin et Serge Gainsbourg","u":"https://archive.org/details/JeTaime...MoiNonPlus"},{"id":"JaneBirkinSergeGainsbourgJeTaimeMoiNonPlusenhanced","t":"Jane Birkin & Serge Gainsbourg-- \"Je T'aime, Moi Nonplus\" (1969)","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"","u":"https://archive.org/details/JaneBirkinSergeGainsbourgJeTaimeMoiNonPlusenhanced"},{"id":"LeonardCohen","t":"leonard cohen","a":"Leonard Cohen","c":"music_and_sound","m":"audio","cr":"leonard cohen","u":"https://archive.org/details/LeonardCohen"},{"id":"polka-serge-gainsbourg-1","t":"Serge Gainsbourg 1","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"","u":"https://archive.org/details/polka-serge-gainsbourg-1"},{"id":"SergeGainsbourg-EvguenieSokolov","t":"SERGE GAINSBOURG - Evguenie Sokolov Incipit","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"www.incipitblog.com","u":"https://archive.org/details/SergeGainsbourg-EvguenieSokolov"},{"id":"polka-Serge-gainsbourg-histoire-de-melody","t":"Serge Gainsbourg - Histoire De Melody Nelson Par Jean-Christophe Averty (1971).avi","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"","u":"https://archive.org/details/polka-Serge-gainsbourg-histoire-de-melody"},{"id":"polka-Serge-gainsbourg-love-on-the-beat","t":"Serge Gainsbourg - Love On The Beat (1984) [FLAC] (2001 reissue)","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"","u":"https://archive.org/details/polka-Serge-gainsbourg-love-on-the-beat"},{"id":"SergeGainsbourg-CesPetitsRiens","t":"Serge Gainsbourg - Ces petits riens","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"","u":"https://archive.org/details/SergeGainsbourg-CesPetitsRiens"},{"id":"staxvolt","t":"A Serge of High Wattage Stax-Volt","a":"Serge Gainsbourg","c":"music_and_sound","m":"audio","cr":"Radio FREE Crockett","u":"https://archive.org/details/staxvolt"},{"id":"the-brown-bunny","t":"The Brown Bunny","a":"Vincent Gallo","c":"film_and_cinema","m":"movies","cr":"Vincent Gallo","u":"https://archive.org/details/the-brown-bunny"},{"id":"kenpark","t":"Ken Park","a":"Larry Clark","c":"film_and_cinema","m":"movies","cr":"Larry Clark","u":"https://archive.org/details/kenpark"},{"id":"Lewisand1950","t":"Lewis and Clark","a":"Larry Clark","c":"film_and_cinema","m":"movies","cr":"Emerson Film Corp.","u":"https://archive.org/details/Lewisand1950"},{"id":"blue-velvet-a","t":"Blue Velvet (1986) 藍色夜合花 港版VCD","a":"David Lynch","c":"film_and_cinema","m":"movies","cr":"David Lynch","u":"https://archive.org/details/blue-velvet-a"}];
const STORAGE_KEY = 'archive-curator-removals';

let marked = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

function saveMarked(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...marked]));
  updateCounter();
}
function updateCounter(){
  document.getElementById('counter').innerHTML =
    `<b>${marked.size}</b> / ${ITEMS.length} marked for removal`;
}

// Group by artist/figure (search_term), alphabetical; items within group alphabetical by title
const groups = {};
for(const it of ITEMS){
  (groups[it.a] ||= []).push(it);
}
const groupNames = Object.keys(groups).sort((a,b)=>a.localeCompare(b));
for(const g of groupNames){
  groups[g].sort((a,b)=>a.t.localeCompare(b.t));
}

function slug(s){ return 'g-' + s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }

function cardHTML(it){
  return `
    <div class="card" data-id="${it.id}" data-search="${(it.t+' '+it.a+' '+it.c).toLowerCase().replace(/"/g,'&quot;')}">
      <input type="checkbox" class="chk" ${marked.has(it.id) ? 'checked' : ''}>
      <div class="thumb-wrap">
        <img src="https://archive.org/services/img/${it.id}" loading="lazy" alt=""
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="fallback" style="display:none;">${it.m || 'item'}</div>
      </div>
      <div class="title">${it.t}</div>
      <div class="mtype">${it.m}</div>
    </div>`;
}

function render(){
  const main = document.getElementById('main');
  const nav = document.getElementById('jumpnav');
  let mainHTML = '';
  let navHTML = '';
  for(const g of groupNames){
    const id = slug(g);
    navHTML += `<a href="#${id}"><span>${g}</span><span class="n">${groups[g].length}</span></a>`;
    mainHTML += `
      <div class="group" id="${id}">
        <div class="group-header">
          <h2>${g}</h2>
          <span class="cnt">${groups[g].length}</span>
          <span class="sel-all" data-group="${g}">mark all</span>
        </div>
        <div class="grid">${groups[g].map(cardHTML).join('')}</div>
      </div>`;
  }
  main.innerHTML = mainHTML;
  nav.innerHTML = navHTML;
  updateCounter();
}
render();

// Toggle mark via checkbox or clicking the card (except link-following isn't needed since whole card opens item)
document.getElementById('main').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if(!card) return;
  const id = card.dataset.id;

  if(e.target.classList.contains('chk')){
    if(e.target.checked) marked.add(id); else marked.delete(id);
    card.classList.toggle('marked', e.target.checked);
    saveMarked();
    return;
  }
  // Clicking anywhere else on the card opens the item in a new tab
  const item = ITEMS.find(it => it.id === id);
  if(item) window.open(item.u, '_blank', 'noopener');
});

document.getElementById('main').addEventListener('click', (e) => {
  const selAll = e.target.closest('.sel-all');
  if(!selAll) return;
  const g = selAll.dataset.group;
  const shouldMark = selAll.textContent === 'mark all';
  for(const it of groups[g]){
    if(shouldMark) marked.add(it.id); else marked.delete(it.id);
  }
  selAll.textContent = shouldMark ? 'unmark all' : 'mark all';
  document.querySelectorAll(`#${slug(g)} .card`).forEach(card => {
    const chk = card.querySelector('.chk');
    chk.checked = shouldMark;
    card.classList.toggle('marked', shouldMark);
  });
  saveMarked();
});

// Reflect initial marked state on card borders
document.querySelectorAll('.card').forEach(card => {
  if(marked.has(card.dataset.id)) card.classList.add('marked');
});

// Filter
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.group').forEach(groupEl => {
    let groupHasMatch = false;
    groupEl.querySelectorAll('.card').forEach(card => {
      const match = !q || card.dataset.search.includes(q);
      card.style.display = match ? '' : 'none';
      if(match) groupHasMatch = true;
    });
    groupEl.style.display = groupHasMatch ? '' : 'none';
    if(groupHasMatch) anyVisible = true;
  });
  document.getElementById('empty-msg').style.display = anyVisible ? 'none' : 'block';
});

// Export CSV of marked items
document.getElementById('exportBtn').addEventListener('click', () => {
  const rows = [['identifier','title','artist','category','mediatype','url']];
  for(const it of ITEMS){
    if(marked.has(it.id)) rows.push([it.id, it.t, it.a, it.c, it.m, it.u]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'to-remove.csv';
  a.click();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const ids = [...marked].join('\n');
  navigator.clipboard.writeText(ids).then(() => {
    const b = document.getElementById('copyBtn');
    const orig = b.textContent;
    b.textContent = 'Copied!';
    setTimeout(() => b.textContent = orig, 1200);
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if(!confirm(`Clear all ${marked.size} marks?`)) return;
  marked.clear();
  saveMarked();
  document.querySelectorAll('.card.marked').forEach(c => c.classList.remove('marked'));
  document.querySelectorAll('.chk').forEach(c => c.checked = false);
  document.querySelectorAll('.sel-all').forEach(s => s.textContent = 'mark all');
});
</script>
</body>
